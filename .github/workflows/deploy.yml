name: Deploy to Cloud Run from feature branch

on:
  push:
    branches:
      - featurs/summarize-endpoint

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          service_account_key: ${{ secrets.GOOGLE_CLOUD_KEYFILE_JSON }}

      - name: Activate service account (write key to file)
        run: |
          echo "${{ secrets.GOOGLE_CLOUD_KEYFILE_JSON }}" > key.json
          gcloud auth activate-service-account --key-file=key.json
          gcloud config set project ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          gcloud auth list
          gcloud config list

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy fastapi-test \
            --source . \
            --region us-central1 \
            --project ${{ secrets.GOOGLE_CLOUD_PROJECT }} \
            --allow-unauthenticated
