name: Deploy to Cloud Run from feature branch

on:
  push:
    branches:
      - featurs/summarize-endpoint

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Set up Google Cloud SDK and authenticate
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          service_account_key: ${{ secrets.GOOGLE_CLOUD_KEYFILE_JSON }}

      # 3. Debug: verify authentication and project
      - name: Verify auth and project
        run: |
          echo "Active account:"
          gcloud auth list
          echo "Current project:"
          gcloud config list --format='value(core.project)'

      # 4. Deploy to Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy fastapi-test \
            --source . \
            --region us-central1 \
            --project ${{ secrets.GOOGLE_CLOUD_PROJECT }} \
            --allow-unauthenticated
