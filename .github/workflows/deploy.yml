# .github/workflows/deploy.yml
name: Deploy FastAPI to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Set up Google Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: "431.0.0"  # Use latest stable if desired

      # 3️⃣ Authenticate with GCP using the JSON secret
      - name: Authenticate to GCP
        run: |
          printf '%s' "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}" > key.json
          gcloud auth activate-service-account --key-file=key.json
          gcloud config set project your-gcp-project-id
          rm key.json

      # 4️⃣ Configure Docker for GCP Artifact Registry (if needed)
      - name: Configure Docker
        run: gcloud auth configure-docker

      # 5️⃣ Build Docker image
      - name: Build Docker image
        run: |
          IMAGE="us-central1-docker.pkg.dev/testreview-481618/fastapi-repo/fastapi-app:latest"
          docker build -t $IMAGE .
          docker push $IMAGE

      # 6️⃣ Deploy to Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy fastapi-app \
            --image $IMAGE \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --port 8080
