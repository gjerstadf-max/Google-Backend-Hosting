name: Deploy to Cloud Run from feature branch

on:
  push:
    branches:
      - featurs/summarize-endpoint

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Set up Google Cloud SDK
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          service_account_key: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      # 3. Activate service account safely
      - name: Activate service account (safe write)
        run: |
          printf '%s' "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}" > key.json
          gcloud auth activate-service-account --key-file=key.json
          gcloud config set project ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          gcloud auth list
          gcloud config list

      # 4. Deploy to Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy fastapi-test \
            --source . \
            --region us-central1 \
            --project ${{ secrets.GOOGLE_CLOUD_PROJECT }} \
            --allow-unauthenticated
